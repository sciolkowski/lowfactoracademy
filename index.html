<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <title>Low Factor Academy - bo życie jest zbyt krótkie aby wolno strzelać</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: #ede4d5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-width: 100vw;
    }

    .image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 70%;
      height: 70%;
      background-color: #ede4d5;
      color: #7a7268;
      font-family: sans-serif;
      font-size: 1rem;
    }
    .image-placeholder img {
      transition: transform 0.3s ease
    }
    .image-placeholder img:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <a href="https://www.facebook.com/lowfactorsquad" target="_blank" class="image-placeholder">
    <img height="100%" src="lowfactoracademy.jpg" alt="Low Factor Academy">
  </a>
</body>
</html>

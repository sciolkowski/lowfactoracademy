  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      background-color: #ede4d5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-width: 100vw;
      gap: 30px;
    }

    .image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60%;
      height: 60%;
      background-color: #ede4d5;
      color: #7a7268;
      font-family: sans-serif;
      font-size: 1rem;
    }

    .image-placeholder img {
      max-width: 100%;
      max-height: 100%;
      transition: transform 0.3s ease;
    }

    .image-placeholder img:hover {
      transform: scale(1.1);
    }

    /* Mobile */
    @media (max-width: 1024px) {
      body {
        flex-direction: column;
        justify-content: flex-start;
        padding-top: 20px;
        gap: 20px;
      }

      .image-placeholder {
        width: 60%;
        height: auto;
      }

      .fb-page {
        width: 340px;
        max-width: 100%;
      }
    }
  </style>
